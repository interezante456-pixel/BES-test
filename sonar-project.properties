# SonarCloud Configuration for BES-test
sonar.projectKey=interezante456-pixel_BES-test
sonar.organization=interezante456-pixel

# Source code directories
sonar.sources=backend/src,frontend/src,extension
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,backend/prisma/migrations/**,backend/uploads/**,**/*.sql,**/*.tar,**/*.tar.gz

# Coverage paths
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
